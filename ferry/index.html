<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{--bg:#F8F7F4;--card:#fff;--ink:#1F2328;--mute:#666460;--line:#E5E0D5;--pri:#1A56DB;--pri2:#EEF3FF;--head:#FAF9F6;--ok:#13795b;--okbg:#e3f5ee;--warn:#9a5b00;--warnbg:#fff3dc;--bad:#b3261e;--badbg:#fde8e6;--mer:#0b6bcb;--tg:#7a3fc4}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1117;--card:#161b22;--ink:#e6edf3;--mute:#9198a1;--line:#30363d;--pri:#4493f8;--pri2:#132a4d;--head:#1c2128;--ok:#4cc9a0;--okbg:#12342b;--warn:#f0b34d;--warnbg:#3a2c10;--bad:#ff8a80;--badbg:#3d1b18;--mer:#5aa7ef;--tg:#b78cf0}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px;font-weight:700;font-size:15px}
.brand i{width:30px;height:30px;border-radius:8px;background:var(--pri);display:grid;place-items:center;color:#fff;font-style:normal;flex-shrink:0}.brand i svg{width:17px;height:17px}
.brand small{display:block;font-weight:500;color:var(--mute);font-size:11px}
.nav button{display:flex;width:100%;gap:9px;align-items:center;text-align:left;background:none;border:0;padding:8px 11px;border-radius:8px;cursor:pointer;color:var(--mute);font-weight:600;font-size:13px}.nav button svg{flex-shrink:0}
.nav button:hover{background:var(--head);color:var(--ink)}.nav button.on{background:var(--pri2);color:var(--pri)}
.side-foot{margin-top:auto;font-size:12px;color:var(--mute);padding:8px}
main{padding:20px 24px 60px;max-width:1500px;width:100%}
h1{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}h2{font-size:15px;font-weight:600;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 16px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.kpi .l{color:var(--mute);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}.kpi .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}.kpi .s{font-size:12px;color:var(--mute);margin-top:2px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)}.btn.sm{padding:5px 10px;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=email],input[type=password],select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute);font-weight:600}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:70vh}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-size:13px}
th{background:var(--head);position:sticky;top:0;z-index:1;font-size:11.5px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
td:first-child,th:first-child,td:nth-child(2),th:nth-child(2){text-align:left}
tr.tot td{font-weight:700;background:var(--head);position:sticky;bottom:0}
tr.we td:first-child,tr.we td:nth-child(2){color:var(--bad)}
td input{width:78px;text-align:right;padding:3px 6px;border-radius:6px}
td.neg{color:var(--bad)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.mer{color:var(--mer)}.tg{color:var(--tg)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:34px;text-align:center;cursor:pointer;background:var(--card)}
.drop.over,.drop:hover{border-color:var(--pri);background:var(--pri2)}
.toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:99;max-width:360px;box-shadow:0 6px 24px #0004}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:50;padding:16px}.modal>div{background:var(--card);border-radius:14px;padding:20px;width:min(420px,100%)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{background:var(--card);border:0;padding:7px 14px;cursor:pointer;font-weight:600;color:var(--mute)}.seg button.on{background:var(--pri);color:#fff}
.stat{display:flex;gap:6px;align-items:center;font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn)}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.hide{display:none!important}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 8px}.side-foot{display:none}.nav{display:flex;flex-wrap:wrap}main{padding:14px 16px 60px}.g4,.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
@media(max-width:520px){.g4,.g3{grid-template-columns:1fr}}


/* embedded inside GoStatement: top tab bar instead of side bar */
body.embed .app{grid-template-columns:1fr}
body.embed aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;border-right:0;border:1px solid var(--line);border-radius:12px;margin:0 0 6px;padding:8px 10px}
body.embed .brand{padding:0 14px 0 0;margin-right:4px;border-right:1px solid var(--line);font-size:14px}body.embed .nav{display:flex;flex-wrap:wrap;gap:2px}body.embed .nav button{width:auto}
body.embed .side-foot{margin:0 0 0 auto;display:flex;gap:10px;align-items:center;padding:0}
body.embed .side-foot>div:last-child{display:none}
body.embed main{padding:12px 4px 60px}body.embed{background:transparent}

/* ---------- Daily summary (dashboard) ---------- */
.day-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.day-head h2{margin:0 0 2px}.day-head .sub{margin:0;font-size:13px}
.day-ctl{display:flex;gap:6px;align-items:center}
.day-ctl .ib{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;color:var(--ink)}
.day-ctl .ib:hover{background:var(--head)}.day-ctl .ib:disabled{opacity:.4;cursor:default}
.day-ctl input[type=date]{height:34px}
.day-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.day-kpis>div{background:var(--card);padding:12px 14px}
.day-kpis .l{font-size:12px;color:var(--mute);font-weight:600}
.day-kpis .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.day-kpis .d{font-size:12px;margin-top:2px;color:var(--mute);font-variant-numeric:tabular-nums}
.up{color:var(--ok)}.down{color:var(--bad)}
.day-split td,.day-split th{position:static}.day-split td:nth-child(2),.day-split th:nth-child(2){text-align:right}
.day-split tr.sum td{font-weight:700;border-bottom:0}
.day-chart{display:flex;align-items:flex-end;gap:4px;height:96px;margin:16px 0 4px;padding-top:6px}
.day-chart button{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;gap:4px;background:none;border:0;padding:0;cursor:pointer}
.day-chart .bar{background:var(--line);border-radius:3px 3px 0 0;min-height:2px;transition:background .12s}
.day-chart button:hover .bar{background:var(--mute)}
.day-chart button.on .bar{background:var(--pri)}
.day-chart .lb{font-size:10px;color:var(--mute);text-align:center;line-height:1}
.day-chart button.on .lb{color:var(--pri);font-weight:700}
.day-foot{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.day-foot b{color:var(--ink);font-variant-numeric:tabular-nums}
@media(max-width:700px){
  .day-kpis{grid-template-columns:1fr 1fr}
  .day-split .opt{display:none}
  .g4{grid-template-columns:1fr 1fr}.g4 .kpi .v{font-size:18px}
  .top .row{width:100%}.top .row select{flex:1}
  body.embed aside{gap:8px}
  body.embed .brand{border-right:0;padding:0}body.embed .brand small{display:none}
  body.embed .nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  body.embed .nav button{white-space:nowrap}
}

/* ---------- INVOICE (screen + print) ---------- */
#invoiceHost{background:#e4e7eb;padding:20px;border-radius:12px}
/* NSS e-invoice layout: mirrors the RFID e-invoice PDF */
.inv{background:#fff;color:#000;width:210mm;height:297mm;margin:0 auto 20px;padding:11mm 12mm 12mm;font:10.5px/1.35 Arial,Helvetica,sans-serif;position:relative;box-shadow:0 1px 6px rgba(0,0,0,.18);page-break-after:always;display:flex;flex-direction:column;overflow:hidden}
.inv *{color:#000}
.inv .hd{display:flex;gap:12px;align-items:flex-start;padding-bottom:6px;border-bottom:1px solid #000}
.inv .hd img{width:26mm;height:auto;flex-shrink:0}
.inv .co{line-height:1.3}.inv .co .nm{font-size:17px;font-weight:700}.inv .co .nm small{font-size:10.5px;font-weight:400}
.inv .blk{display:grid;grid-template-columns:1.12fr 1fr;gap:18px;padding:6px 3mm 7px;border-bottom:1px solid #000}
.inv .kv{display:grid;grid-template-columns:auto 10px 1fr;row-gap:2px;align-content:start}
.inv .kv span:nth-child(3n+1){white-space:nowrap;padding-right:8px}
.inv .kv.rv span:nth-child(3n){text-align:right}
.inv .ein{font-size:17px;font-weight:700;text-align:right;margin:0 0 6px}
.inv table.it{width:100%;border-collapse:collapse}
.inv table.it th{font-weight:400;font-size:10px;line-height:1.25;text-align:center;vertical-align:top;padding:4px;border:0;border-bottom:1px solid #000;background:none;position:static;white-space:normal}
.inv table.it td{padding:6px 4px;border:0;font-size:10.5px;vertical-align:top;white-space:normal;text-align:left}
.inv .c{text-align:center!important}.inv .r{text-align:right!important}.inv .l{text-align:left!important}
.inv .grow{flex:1}
.inv .tot{display:flex;justify-content:space-between;gap:16px;border-top:1px solid #000;padding:4px 0 0 2mm}
.inv .tot table{border-collapse:collapse;width:auto}
.inv .tot td{font-weight:700;padding:1px 4px;border:0;text-align:right;font-size:10.5px;white-space:nowrap}
.inv .tot td.b{border:1px solid #000;min-width:33mm;font-size:12px}
.inv .notes{margin-top:14mm;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-left:2mm}
.inv .bank{display:grid;grid-template-columns:auto 14px auto;justify-content:start;row-gap:1px;margin:2px 0 4px 5mm}
.inv .qr{width:30mm;text-align:center;font-size:10px;flex-shrink:0}.inv .qr div{width:22mm;height:22mm;border:1px dashed #aaa;margin:0 auto 3px}
.inv .pg{position:absolute;right:12mm;bottom:6mm;font-size:9px;color:#555!important}
.inv h3{font:700 13px/1.3 Arial,Helvetica,sans-serif;margin:10px 0 2px}
.inv h4{font:700 11px/1.3 Arial,Helvetica,sans-serif;margin:12px 0 2px}
.inv .note{font-size:10px;margin:2px 0}
.inv table.st{width:100%;border-collapse:collapse}
.inv table.st td{padding:3px 4px;border:0;border-bottom:1px solid #e3e3e3;font-size:10.5px;text-align:left;white-space:normal}
.inv table.st td:last-child{text-align:right;width:36mm;font-variant-numeric:tabular-nums}
.inv table.st tr.g td{font-weight:700;border-top:1px solid #000;border-bottom:1px solid #000}
.inv table.an{width:100%;border-collapse:collapse}
.inv table.an th{font-weight:700;font-size:9px;padding:3px 4px;border:0;border-top:1px solid #000;border-bottom:1px solid #000;text-align:right;background:none;position:static;white-space:nowrap}
.inv table.an td{font-size:9.2px;padding:1.4px 4px;border:0;border-bottom:1px solid #eee;text-align:right}
.inv table.an th:first-child,.inv table.an td:first-child{text-align:left}
.inv table.an tr.t td{font-weight:700;border-top:1px solid #000;border-bottom:1px solid #000}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff}.app>aside,main>*:not(#invoiceHostWrap){display:none!important}

 .inv{box-shadow:none;margin:0;width:210mm;height:297mm;overflow:hidden}.toast,.modal{display:none!important}
}

/* ---------- settlement maths (matches the Excel master exactly) ---------- */
function calc(rec){
  const R=CFG.rates,t=+rec.t||0,a=+rec.a||0,u=+rec.u||0;
  // MDR is the ACTUAL fee reported by the payment gateway when present (it can differ by a sen from 2.8%);
  // when not supplied it falls back to 2.8% of the total online amount.
  const B=r2(a*R.proc),C=r2(a+B),D=r2(t*R.commission),E=r2(D*R.sst);
  const hasM=rec.m!==undefined&&rec.m!==null&&rec.m!=='';const F=hasM?r2(Math.abs(+rec.m)):r2(C*R.mdr),G=r2(F*R.sst);
  const H=r2(C-D-E-F-G),J=r2(u*R.commission),K=r2(J*R.sst),L=r2(J+K),M=r2(H-L);
  return{t,a,u,B,C,D,E,F,G,H,J,K,L,M,charges:r2(D+E+F+G+L)};
}
function sumCalc(list){const z={t:0,a:0,u:0,B:0,C:0,D:0,E:0,F:0,G:0,H:0,J:0,K:0,L:0,M:0,charges:0};for(const c of list)for(const k in z)z[k]=r2(z[k]+c[k]);return z}
function rowsFor(station,from,to){const out=[];for(const k in DATA){const[s,d]=k.split('|');if(s===station&&d>=from&&d<=to)out.push({date:d,...calc(DATA[k])})}return out.sort((x,y)=>x.date<y.date?-1:1)}
function allDates(){return[...new Set(Object.keys(DATA).map(k=>k.split('|')[1]))].sort()}

async function cloudPush(keys){
  if(!sb||!UI.session||!keys.length)return{ok:false,saved:0};
  const rows=keys.filter(k=>DATA[k]).map(k=>{const[s,d]=k.split('|');const r=DATA[k];return{station:s,entry_date:d,tickets:+r.t||0,sales:+r.a||0,agent_tickets:+r.u||0,mdr:(r.m===undefined||r.m===null||r.m==='')?null:+r.m,source:r.src||'app'}});
  let saved=0;
  for(let i=0;i<rows.length;i+=400){
    const chunk=rows.slice(i,i+400);
    const{data,error}=await sb.from('ferry_daily').upsert(chunk,{onConflict:'station,entry_date'}).select('station,entry_date');
    if(error){toast('Cloud save failed: '+error.message,6000);return{ok:false,saved}}
    if(!data||data.length<chunk.length){toast('Cloud only saved '+(data?data.length:0)+' of '+chunk.length+' rows — check admin access',7000);return{ok:false,saved:saved+(data?data.length:0)}}
    saved+=data.length;chunk.forEach(r=>DIRTY.delete(keyOf(r.station,r.entry_date)));
  }
  persistLocal();setSync();livePing();return{ok:true,saved};
}
async function cloudDelete(key){
  if(!sb||!UI.session)return true;const[s,d]=key.split('|');
  const{data,error}=await sb.from('ferry_daily').delete().eq('station',s).eq('entry_date',d).select('station');
  if(error){toast('Cloud delete failed: '+error.message,6000);return false}livePing();return true;
}

/* ---------- live sync between admins ----------
   After any successful cloud save, this page broadcasts a tiny "changed" ping
   (no data in it). Every other open Ferry page re-pulls from Supabase, so a
   figure keyed in on one computer shows on the others within a second or two.
   Backup: re-pull when the tab comes back into view, and every 60s while open. */
let FCH=null,pullT=null;
function livePing(){try{FCH&&FCH.send({type:'broadcast',event:'changed',payload:{at:Date.now()}})}catch(e){}}
function liveRefresh(msg){
  clearTimeout(pullT);
  pullT=setTimeout(async()=>{
    if(!sb||!UI.session)return;
    const before=JSON.stringify([DATA,UND,CFG]);
    await cloudPull();await undPull();setSync();
    if(JSON.stringify([DATA,UND,CFG])===before)return;
    const a=document.activeElement;
    // don't yank the page from under someone typing in Daily Data
    if(!(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&$('#main').contains(a)))render();
    toast(msg||'Updated with the latest figures',2500);
  },700);
}
function startLive(){
  if(FCH||!sb)return;
  FCH=sb.channel('gostatement-ferry',{config:{broadcast:{self:false}}})
    .on('broadcast',{event:'changed'},()=>liveRefresh('New figures from another admin'))
    .subscribe();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')liveRefresh()});
  setInterval(()=>{if(document.visibilityState==='visible')liveRefresh()},60000);
}
async function cloudPull(){
  if(!sb||!UI.session)return;
  let all=[],from=0;
  for(;;){
    const{data,error}=await sb.from('ferry_daily').select('station,entry_date,tickets,sales,agent_tickets,mdr').order('entry_date').range(from,from+999);
    if(error){toast('Cloud load failed: '+error.message,6000);return}
    all=all.concat(data);if(data.length<1000)break;from+=1000;
  }
  const remote={};for(const r of all)remote[keyOf(r.station,r.entry_date)]={t:r.tickets,a:+r.sales,u:r.agent_tickets,m:r.mdr===null?null:+r.mdr};
  for(const k in DATA)if(!DIRTY.has(k)&&!remote[k])delete DATA[k]; // removed elsewhere
  for(const k in remote)if(!DIRTY.has(k))DATA[k]=remote[k];
  const{data:st}=await sb.from('ferry_settings').select('value').eq('key','config').maybeSingle();
  if(st&&st.value&&Object.keys(st.value).length)CFG=deepMerge(JSON.parse(JSON.stringify(DEF_CFG)),st.value);
  persistLocal();
}
async function saveCfg(){
  persistLocal();
  if(sb&&UI.session){const{data,error}=await sb.from('ferry_settings').upsert({key:'config',value:CFG,updated_at:new Date().toISOString()},{onConflict:'key'}).select('key');
    if(error||!data||!data.length)toast('Settings saved locally only: '+(error?error.message:'no access'),6000);else{toast('Settings saved to cloud');livePing()}}
  else toast('Settings saved on this device (login to sync)')
}

/* ---------- Undersales tracker ----------
   Mirrors the "UNDERSALES TRACKER" Excel: when a settlement batch nets NEGATIVE (agent commission > online net),
   the shortfall is an UNDERSALE owed by the operator; later positive settlements RECOVER it (FIFO). */
let UND=load('gsf_und',[]);
let UDIRTY=new Set(load('gsf_udirty',[]));
const uKey=u=>[u.station,u.date,u.kind,(+u.amount).toFixed(2),u.desc||''].join('|');
function persistUnd(){save('gsf_und',UND);save('gsf_udirty',[...UDIRTY])}
function undLedger(station){
  const rows=UND.filter(u=>u.station===station).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.kind===b.kind?0:a.kind==='undersale'?-1:1));
  let cumU=0,cumR=0;const out=[];
  for(const r of rows){if(r.kind==='undersale')cumU=r2(cumU+ +r.amount);else cumR=r2(cumR+ +r.amount);out.push({...r,key:uKey(r),cumU,cumR,bal:r2(cumU-cumR)})}
  out.forEach((r,i)=>{r.cleared=null;if(r.kind==='undersale'){for(let j=i;j<out.length;j++){if(out[j].kind==='recovery'&&out[j].cumR>=r.cumU-0.005){r.cleared=out[j].date;break}}}});
  return out;
}
function undBalanceAt(station,date){let b=0;for(const r of undLedger(station)){if(r.date<=date)b=r.bal;else break}return b}
function undPeriod(station,from,to){
  const L=undLedger(station);let added=0,rec=0;
  for(const r of L)if(r.date>=from&&r.date<=to){if(r.kind==='undersale')added=r2(added+ +r.amount);else rec=r2(rec+ +r.amount)}
  return{added,rec,bal:undBalanceAt(station,to),any:L.length>0};
}
async function undPush(keys){
  if(!sb||!UI.session||!keys.length)return{ok:false,saved:0};
  const rows=UND.filter(u=>keys.includes(uKey(u))).map(u=>({station:u.station,entry_date:u.date,kind:u.kind,amount:+u.amount,description:u.desc||''}));
  let saved=0;
  for(let i=0;i<rows.length;i+=400){const ch=rows.slice(i,i+400);
    const{data,error}=await sb.from('ferry_undersales').upsert(ch,{onConflict:'station,entry_date,kind,amount,description'}).select('station');
    if(error){toast('Undersales cloud save failed: '+error.message,7000);return{ok:false,saved}}
    if(!data||data.length<ch.length){toast('Cloud saved only '+(data?data.length:0)+' of '+ch.length+' undersales rows',7000);return{ok:false,saved}}
    saved+=data.length}
  keys.forEach(k=>UDIRTY.delete(k));persistUnd();setSync();livePing();return{ok:true,saved};
}
async function undPull(){
  if(!sb||!UI.session)return;
  const{data,error}=await sb.from('ferry_undersales').select('station,entry_date,kind,amount,description').order('entry_date').range(0,4999);
  if(error){toast('Undersales load failed: '+error.message,6000);return}
  const remote=data.map(r=>({station:r.station,date:r.entry_date,kind:r.kind,amount:+r.amount,desc:r.description||''}));
  const keep=UND.filter(u=>UDIRTY.has(uKey(u)));const rk=new Set(remote.map(uKey));
  UND=remote.concat(keep.filter(u=>!rk.has(uKey(u))));persistUnd();
}
async function undAdd(list,src){
  const have=new Set(UND.map(uKey));const keys=[];let dup=0;
  for(const u of list){const k=uKey(u);if(have.has(k)){dup++;continue}have.add(k);UND.push({station:u.station,date:u.date,kind:u.kind,amount:r2(+u.amount),desc:u.desc||''});UDIRTY.add(k);keys.push(k)}
  persistUnd();let res={ok:true,saved:0};
  if(UI.session&&keys.length)res=await undPush(keys);
  return{added:keys.length,dup,cloud:UI.session?res.ok:null};
}
async function undDelete(key){
  const u=UND.find(x=>uKey(x)===key);if(!u)return;
  if(UI.session&&sb){const{error}=await sb.from('ferry_undersales').delete().match({station:u.station,entry_date:u.date,kind:u.kind,amount:+u.amount,description:u.desc||''});
    if(error){toast('Cloud delete failed: '+error.message,6000);return}}
  UND=UND.filter(x=>uKey(x)!==key);UDIRTY.delete(key);persistUnd();
}
function parseUndersalesWb(wb){
  const out=[];
  for(const name of wb.SheetNames){
    const U=name.toUpperCase();const station=U.includes('MERSING')?'MERSING':(U.includes('GEMOK')||U.includes('GEMUK'))?'TG_GEMOK':null;if(!station)continue;
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
    let hr=rows.findIndex(r=>String(r[0]||'').trim().toUpperCase()==='DATE');if(hr<0)continue;
    for(let i=hr+1;i<rows.length;i++){const r=rows[i];if(typeof r[0]!=='number'||r[0]<40000)continue;
      const date=serialToISO(r[0]),desc=String(r[1]||'').trim();
      if(typeof r[2]==='number'&&r[2]>0)out.push({station,date,kind:'undersale',amount:r2(r[2]),desc});
      if(typeof r[3]==='number'&&r[3]>0)out.push({station,date,kind:'recovery',amount:r2(r[3]),desc})}
  }
  return out;
}
/* Settlement batches: Tue/Wed/Thu are settled on their own day; Fri+Sat+Sun+Mon are settled together on the Monday. */
function batchPost(iso){const d=dow(iso);if(d===5)return addDays(iso,3);if(d===6)return addDays(iso,2);if(d===0)return addDays(iso,1);return iso}
function batchStart(post){return dow(post)===1?addDays(post,-3):post}
function undSuggest(station,startFrom){
  const days=Object.keys(DATA).filter(k=>k.startsWith(station+'|')).map(k=>k.split('|')[1]).sort();
  const batches={};for(const d of days){const p=batchPost(d);(batches[p]=batches[p]||[]).push(d)}
  const ledgerDates=new Set(undLedger(station).map(r=>r.date));
  const out=[];let delta=0;
  for(const post of Object.keys(batches).sort()){
    if(batchStart(post)<startFrom)continue;
    if(ledgerDates.has(post))continue;
    const cs=batches[post].map(d=>calc(DATA[keyOf(station,d)]));const S=sumCalc(cs);const net=S.M;
    const bal=r2(undBalanceAt(station,post)+delta);
    if(net<-0.004){const amt=r2(-net);delta=r2(delta+amt);out.push({station,date:post,kind:'undersale',amount:amt,desc:`Short: NET ${Math.max(S.H,0).toFixed(2)} - agent ${S.L.toFixed(2)}`})}
    else if(net>0.004&&bal>0.004){const rc=r2(Math.min(bal,net));delta=r2(delta-rc);out.push({station,date:post,kind:'recovery',amount:rc,desc:'Recovered from settlement'})}
  }
  return out;
}

/* ---------- Excel import ---------- */
function serialToISO(n){return new Date(Math.round((n-25569)*86400)*1000).toISOString().slice(0,10)}
function parseWorkbook(wb){
  const out=[],notes=[];
  for(const name of wb.SheetNames){
    const ws=wb.Sheets[name];const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
    let hr=-1;for(let i=0;i<Math.min(rows.length,15);i++){if(String(rows[i][0]||'').trim().toUpperCase()==='DAY'){hr=i;break}}
    if(hr<0)continue;
    const hdr=rows[hr];const cols={};
    hdr.forEach((c,j)=>{const s=String(c||'').trim().toUpperCase();if(s==='MERSING')cols.MERSING=j;if(s==='TANJUNG GEMOK'||s==='TG GEMOK'||s==='TANJUNG GEMUK')cols.TG_GEMOK=j});
    if(cols.MERSING==null&&cols.TG_GEMOK==null)continue;
    let n=0;
    for(let i=hr+1;i<rows.length;i++){
      const r=rows[i];const dv=r[1];if(typeof dv!=='number'||dv<40000)continue;const date=serialToISO(dv);
      for(const s of SK){const c0=cols[s];if(c0==null)continue;
        const t=r[c0],a=r[c0+1],u=r[c0+9],m=r[c0+6];
        if(typeof t!=='number'&&typeof a!=='number'&&typeof u!=='number')continue;
        out.push({station:s,date,t:+t||0,a:+a||0,u:+u||0,m:typeof m==='number'?Math.abs(m):null});n++}
    }
    notes.push(`${name}: ${n} station-days`);
  }
  return{rows:out,notes};
}
async function handleFile(file){
  try{
    await loadXLSX();const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});
    const{rows,notes}=parseWorkbook(wb);
    if(!rows.length){toast('No daily sales found. Expected the monthly tabs (e.g. 2610) with DAY / MERSING / TANJUNG GEMOK headers.',7000);return}
    for(const r of rows){const old=DATA[keyOf(r.station,r.date)];r.status=!old?'new':(old.t===r.t&&+old.a===r.a&&old.u===r.u&&(old.m??null)===(r.m??null)?'same':'update')}
    UI.staged={file:file.name,rows,notes};render();
  }catch(e){console.error(e);toast('Could not read file: '+e.message,6000)}
}
async function confirmImport(){

  persistLocal();

  else msg=`Imported ${todo.length} row(s) on this device only. Login to save to cloud.`;

  UI.lastImport={from:dates[0],to:dates[dates.length-1]};UI.staged=null;UI.month=monthOf(dates[dates.length-1]);setSync();render();
}

/* ---------- number → words ---------- */
function words(n){
  const o=['','ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE','TEN','ELEVEN','TWELVE','THIRTEEN','FOURTEEN','FIFTEEN','SIXTEEN','SEVENTEEN','EIGHTEEN','NINETEEN'];
  const t=['','','TWENTY','THIRTY','FORTY','FIFTY','SIXTY','SEVENTY','EIGHTY','NINETY'];
  const h=x=>{let s='';if(x>=100){s+=o[Math.floor(x/100)]+' HUNDRED';x%=100;if(x)s+=' '}if(x>=20){s+=t[Math.floor(x/10)];if(x%10)s+=' '+o[x%10]}else if(x)s+=o[x];return s};
  const conv=x=>{if(x===0)return'ZERO';let s='';const parts=[[1e9,'BILLION'],[1e6,'MILLION'],[1e3,'THOUSAND']];for(const[v,l]of parts){if(x>=v){s+=conv(Math.floor(x/v))+' '+l+' ';x%=v}}if(x)s+=h(x);return s.trim()};
  const tot=Math.round(n*100);const rm=Math.floor(tot/100),sen=tot%100;
  return 'RINGGIT MALAYSIA '+conv(rm)+(sen?' AND CENTS '+conv(sen):'')+' ONLY';
}

/* ---------- invoice builder ---------- */
function weekRange(iso){const d=dow(iso);const mon=addDays(iso,d===0?-6:1-d);return[mon,addDays(mon,6)]}
function monthStartFor(ym){
  const[y,m]=ym.split('-').map(Number);const prev=m===1?`${y-1}-12`:`${y}-${pad(m-1)}`;
  const days=[...new Set(Object.keys(DATA).map(k=>k.split('|')[1]).filter(d=>d.startsWith(prev+'-')))].sort();
  const before=Object.keys(DATA).some(k=>k.split('|')[1]<prev+'-01');
  return(days.length&&days.length<=3&&!before)?days[0]:ym+'-01';
}
function periodFor(mode,date){
  if(mode==='daily')return{from:date,to:date,label:dmy(date)};
  if(mode==='weekly'){const[f,t]=weekRange(date);return{from:f,to:t,label:`${dmy(f)} - ${dmy(t)}`}}
  if(mode==='monthly'){const ym=monthOf(date);const f=monthStartFor(ym),t=ym+'-'+pad(daysInMonth(ym));return{from:f,to:t,label:f===ym+'-01'?monthLabel(ym):`${dmy(f)} - ${dmy(t)}`}}
  return null;
}
function invNo(station,mode,p){
  const pre=CFG.stations[station].prefix;const c=s=>s.replace(/-/g,'');
  if(mode==='daily')return `${pre}-${c(p.from)}`;
  if(mode==='weekly')return `${pre}-W${c(p.from)}`;
  if(mode==='monthly')return `${pre}-M${c(p.from).slice(0,6)}`;
  return `${pre}-${c(p.from)}-${c(p.to)}`;
}
function buildInvoice(station,mode,p){
  const rows=rowsFor(station,p.from,p.to);if(!rows.length)return null;
  const S=sumCalc(rows),R=CFG.rates,C=CFG.stations[station],P=CFG.supplier;
  const dotp=`${p.from.split('-').reverse().join('.')}-${p.to.split('-').reverse().join('.')}`;
  const stn=STATIONS[station].name;const nm=stn.split(' ').map(w=>w[0]+w.slice(1).toLowerCase()).join(' ');
  const dd=iso=>iso.split('-').reverse().join('.');
  const br=p.from===p.to?`[${dd(p.from)}]`:`[${dd(p.from)}-${dd(p.to)}]`;
  const sstIn=x=>r2(x*R.sst/(1+R.sst));
  const lines=[
    {d:`${nm} Commission ${br}`,tot:r2(S.D+S.E)},
    {d:`${nm} MDR Charges ${br}`,tot:r2(S.F+S.G)},
    {d:`${nm} Agent Commission ${br}`,tot:S.L}
  ];
  lines.forEach(l=>{l.tax=sstIn(l.tot)});
  const incl=r2(lines.reduce((x,l)=>x+l.tot,0)),tax=r2(lines.reduce((x,l)=>x+l.tax,0)),excl=r2(incl-tax);
  const payout=addDays(p.to,R.payoutDays);
  const showAnnex=mode!=='daily'&&rows.length>1;
  return{station,mode,p,rows,S,lines,excl,tax,incl,no:invNo(station,mode,p),dotp,stn,C,P,payout,showAnnex,R};
}

function refreshTot(){
  const ym=UI.month,M=monthSum('MERSING',ym),T=monthSum('TG_GEMOK',ym);const el=$('#dataTot');if(!el)return;
  el.innerHTML=`<td>TOTAL</td><td></td><td>${fmtN(M.t)}</td><td>${fmt(M.a)}</td><td>${fmtN(M.u)}</td><td>${fmt(M.F)}</td><td>${fmt(M.charges)}</td><td>${fmt(M.M)}</td><td></td><td>${fmtN(T.t)}</td><td>${fmt(T.a)}</td><td>${fmtN(T.u)}</td><td>${fmt(T.F)}</td><td>${fmt(T.charges)}</td><td>${fmt(T.M)}</td><td></td><td>${fmt(r2(M.M+T.M))}</td>`;
}
function wireData(){
  const body=$('#dataBody');if(!body)return;
  document.querySelectorAll('#dataBody tr').forEach(tr=>{const iso=tr.dataset.d;let pay=0,has=false;for(const s of SK){const r=DATA[keyOf(s,iso)];if(r){pay+=calc(r).M;has=true}}tr.querySelector('[data-c="pay"]').textContent=has?fmt(r2(pay)):'—'});
  refreshTot();
  body.addEventListener('change',async e=>{
    const i=e.target;if(!i.dataset||!i.dataset.f)return;const s=i.dataset.s,d=i.dataset.d;
    const cur=DATA[keyOf(s,d)]||{t:0,a:0,u:0,m:null};const rec={t:cur.t,a:cur.a,u:cur.u,m:cur.m};const f=i.dataset.f;rec[f]=i.value===''?(f==='m'?null:0):+i.value;
    if(rec[f]!==null&&(rec[f]<0||isNaN(rec[f]))){toast('Enter a number ≥ 0');return}
    const r=await setRecord(s,d,rec,'manual');refreshRow(d);
    if(UI.session&&r.ok)toast('Saved',1200);else if(!UI.session)toast('Saved on this device — login to save to cloud',2500);
  });
  body.addEventListener('click',async e=>{
    const b=e.target.closest('[data-del]');if(!b)return;const k=b.dataset.del;const[s,d]=k.split('|');
    if(!confirm(`Delete ${STATIONS[s].name} ${dmy(d)}?`))return;
    if(await cloudDelete(k)){delete DATA[k];DIRTY.delete(k);persistLocal();
      const tr=document.querySelector(`#dataBody tr[data-d="${d}"]`);SK.forEach((ss,ix)=>{if(ss===s){[0,1,2,3].forEach(j=>{const inp=tr.children[2+ix*7+j].querySelector('input');if(inp){inp.value='';if(j===3)inp.placeholder='auto'}})}});refreshRow(d)}
  });
}

function pageUp(){
  const st=UI.staged;
  let h=`<div class="top"><div><h1>Upload Excel</h1><p class="sub">Drop the <b>SUMMARY SALES MERSING AND TANJUNG GEMOK</b> workbook. Every monthly tab (2609, 2610 …) is read automatically; days already in the system are updated, not duplicated.</p></div></div>
  <div class="drop" id="drop"><div style="color:var(--mute);margin-bottom:6px"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg></div><b>Drop .xlsx here or click to choose</b><div class="sub" style="margin:6px 0 0">Reads: No. of tickets · Ticket sales · Agent tickets per station per day. Everything else is calculated.</div><input type="file" id="fileIn" accept=".xlsx,.xls" class="hide"></div>`;
  if(st){
    const c={new:0,update:0,same:0};st.rows.forEach(r=>c[r.status]++);
    const bySt=SK.map(s=>{const rr=st.rows.filter(r=>r.station===s);const S=sumCalc(rr.map(r=>calc(r)));return `<tr><td class="${STATIONS[s].cls}"><b>${STATIONS[s].name}</b></td><td>${rr.length}</td><td>${fmtN(S.t)}</td><td>${fmt(S.a)}</td><td>${fmtN(S.u)}</td><td>${fmt(S.M)}</td></tr>`}).join('');
    h+=`<div class="card" style="margin-top:14px"><h2>Preview — ${esc(st.file)}</h2><div class="row" style="margin-bottom:10px"><span class="pill ok">${c.new} new</span><span class="pill warn">${c.update} will update</span><span class="pill">${c.same} unchanged</span><span class="sub" style="margin:0">${esc(st.notes.join(' · '))}</span></div>
    <div class="tw"><table><thead><tr><th>Station</th><th>Days</th><th>Tickets</th><th>Online sales</th><th>Agent T.</th><th>Net payable</th></tr></thead><tbody>${bySt}</tbody></table></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="btnImp" ${c.new+c.update?'':'disabled'}>Save ${c.new+c.update} row(s) ${UI.session?'to cloud':'(this device)'}</button><button class="btn ghost" id="btnCancelImp">Cancel</button>${UI.session?'':'<span class="pill warn">Not logged in — data will stay on this device only</span>'}</div></div>`;
  }
  if(UI.lastImport&&!st){h+=`<div class="card" style="margin-top:14px"><h2>Import complete</h2><p class="sub">${dmy(UI.lastImport.from)} → ${dmy(UI.lastImport.to)} is saved. Generate invoices now:</p><div class="row"><button class="btn" id="btnInvNow">Daily invoices for imported days</button><button class="btn ghost" data-go="inv">Open Invoices</button></div></div>`}
  return h;
}
function wireUp(){
  const d=$('#drop'),f=$('#fileIn');if(!d)return;
  d.onclick=()=>f.click();f.onchange=()=>f.files[0]&&handleFile(f.files[0]);
  d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');
  d.ondrop=e=>{e.preventDefault();d.classList.remove('over');e.dataTransfer.files[0]&&handleFile(e.dataTransfer.files[0])};
  $('#btnImp')&&($('#btnImp').onclick=confirmImport);$('#btnCancelImp')&&($('#btnCancelImp').onclick=()=>{UI.staged=null;render()});
  $('#btnInvNow')&&($('#btnInvNow').onclick=()=>{go('inv');UI.invMode='daily';batchDaily(UI.lastImport.from,UI.lastImport.to,'BOTH')});
}

function pageInv(){
  const dateRow=UI.invMode==='custom'?`<label class="f">From<input type="date" id="invFrom" value="${UI.invDate}"></label><label class="f">To<input type="date" id="invTo" value="${UI.invTo||UI.invDate}"></label>`:`<label class="f">${UI.invMode==='monthly'?'Any date in month':UI.invMode==='weekly'?'Any date in week':'Date'}<input type="date" id="invDate" value="${UI.invDate}"></label>`;
  const p=UI.invMode==='custom'?{label:`${dmy(UI.invDate)} - ${dmy(UI.invTo||UI.invDate)}`}:periodFor(UI.invMode,UI.invDate);
  return `<div class="top"><div><h1>Invoices</h1><p class="sub">NSS e-invoice format · generated from the saved daily data. Print → “Save as PDF”.</p></div></div>
  <div class="card"><div class="row" style="align-items:flex-end;gap:14px">
   <div><div class="sub" style="margin:0 0 4px;font-size:12px">Type</div><div class="seg" id="segMode">${['daily','weekly','monthly','custom'].map(m=>`<button data-m="${m}" class="${UI.invMode===m?'on':''}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div></div>
   <label class="f">Station<select id="invSt"><option value="BOTH" ${UI.invStation==='BOTH'?'selected':''}>Both (2 invoices)</option><option value="MERSING" ${UI.invStation==='MERSING'?'selected':''}>Mersing</option><option value="TG_GEMOK" ${UI.invStation==='TG_GEMOK'?'selected':''}>Tanjung Gemok</option></select></label>
   ${dateRow}<button class="btn" id="btnGen">Generate</button></div>
   <p class="sub" style="margin:10px 0 0">Period: <b>${esc(p.label)}</b></p></div>
  <div class="card"><h2>Batch</h2><div class="row"><button class="btn ghost" id="btnBatchMonth">All daily invoices for ${monthLabel(UI.month||UI.invDate.slice(0,7))} (${monthsDaysCount()} days)</button><span class="sub" style="margin:0">One PDF with a page per day per station.</span></div></div>
  <div id="invBar" class="card hide"><div class="row"><button class="btn" id="btnPrint">Print / Save as PDF</button><span id="mailBtns" class="row"></span><button class="btn ghost" id="btnCloseInv">Close preview</button></div></div>
  <div id="invPreview"></div>`;
}
function monthsDaysCount(){const ym=UI.month||UI.invDate.slice(0,7);return new Set(Object.keys(DATA).filter(k=>k.split('|')[1].startsWith(ym)).map(k=>k.split('|')[1])).size}
function batchDaily(from,to,station){
  const dates=allDates().filter(d=>d>=from&&d<=to);const list=[];
  for(const d of dates)for(const v of genInvoices(station,'daily',d))list.push(v);
  render();setTimeout(()=>showInvoices(list),0);
}
function renderInvPreview(){
  const list=UI.invList||[];const host=$('#invPreview');
  if(host)host.innerHTML=`<p class="sub">${list.length} invoice(s) ready — scroll the preview below.</p>`;
  const mb=$('#mailBtns');if(mb)mb.innerHTML=list.length<=4?list.map(v=>`<a class="btn ghost" style="text-decoration:none" href="${mailto(v)}">Email ${esc(STATIONS[v.station].name)}</a>`).join(''):'';
}
function mailto(v){
  const sub=encodeURIComponent(`Settlement Invoice ${v.no} — ${v.stn} (${v.p.label})`);
  const body=encodeURIComponent(`Dear ${v.C.buyer},\n\nPlease find attached the settlement e-invoice ${v.no} for ${v.stn}, period ${v.p.label}.\n\nOnline collection: RM ${fmt(v.S.C)}\nNSS charges (incl. SST): RM ${fmt(v.incl)}\nNet payable: RM ${fmt(v.S.M)}\nPayout date: ${dmy(v.payout)}\n\nRegards,\nNSS IT Solution Sdn Bhd`);
  return `mailto:${v.C.email}?subject=${sub}&body=${body}`;
}
function wireInv(){
  const q=s=>document.querySelector(s);
  q('#segMode').onclick=e=>{const b=e.target.closest('button');if(b){UI.invMode=b.dataset.m;render()}};
  q('#invSt').onchange=e=>UI.invStation=e.target.value;
  if(q('#invDate'))q('#invDate').onchange=e=>{UI.invDate=e.target.value;render()};
  if(q('#invFrom')){q('#invFrom').onchange=e=>{UI.invDate=e.target.value};q('#invTo').onchange=e=>{UI.invTo=e.target.value}}
  q('#btnGen').onclick=()=>{
    const st=q('#invSt').value;UI.invStation=st;
    const list=genInvoices(st,UI.invMode,UI.invDate,UI.invTo||UI.invDate);
    if(!list.length)return toast('No saved sales for that period/station.');
    showInvoices(list);
  };
  q('#btnBatchMonth').onclick=()=>{const ym=UI.month||UI.invDate.slice(0,7);batchDaily(ym+'-01',ym+'-31',q('#invSt').value)};
  q('#btnPrint')&&(q('#btnPrint').onclick=()=>window.print());
  q('#btnCloseInv')&&(q('#btnCloseInv').onclick=()=>{$('#invoiceHostWrap').classList.add('hide');UI.invList=null;render()});
  if(UI.invList){$('#invBar').classList.remove('hide');renderInvPreview()}
}

function pageSet(){
  const R=CFG.rates,P=CFG.supplier;
  const f=(path,label,v,type='text')=>`<label class="f">${label}<input type="${type}" data-cfg="${path}" value="${esc(v)}" ${type==='number'?'step="any"':''}></label>`;
  const st=s=>{const c=CFG.stations[s];return `<div class="card"><h2 class="${STATIONS[s].cls}">${STATIONS[s].name} — buyer & payee</h2><div class="grid g2">${f(`stations.${s}.buyer`,'Buyer name',c.buyer)}${f(`stations.${s}.email`,'Buyer email',c.email,'email')}${f(`stations.${s}.tin`,'Buyer TIN',c.tin)}${f(`stations.${s}.reg`,'Buyer registration no.',c.reg)}${f(`stations.${s}.addr`,'Buyer address',c.addr)}${f(`stations.${s}.contact`,'Buyer contact no.',c.contact)}${f(`stations.${s}.prefix`,'Invoice no. prefix',c.prefix)}${f(`stations.${s}.payee`,'Payment label',c.payee)}${f(`stations.${s}.bank`,'Bank',c.bank)}${f(`stations.${s}.acc`,'Account no.',c.acc)}</div></div>`};
  return `<div class="top"><div><h1>Settings</h1><p class="sub">Rates apply to all stations and all months (recalculated live). Blank buyer TIN/address will print “-” until you fill them.</p></div><button class="btn" id="btnSaveCfg">Save settings</button></div>
  <div class="card"><h2>Rates</h2><div class="grid g4">${f('rates.commission','Commission RM / ticket',R.commission,'number')}${f('rates.sst','SST (0.08 = 8%)',R.sst,'number')}${f('rates.mdr','MDR (0.028 = 2.8%)',R.mdr,'number')}${f('rates.proc','Processing fee (0.03 = 3%)',R.proc,'number')}${f('rates.payoutDays','Payout days after period end',R.payoutDays,'number')}</div></div>
  ${st('MERSING')}${st('TG_GEMOK')}
  <div class="card"><h2>Supplier (NSS)</h2><div class="grid g2">${f('supplier.name','Name',P.name)}${f('supplier.tin','TIN',P.tin)}${f('supplier.reg','Registration no.',P.reg)}${f('supplier.sst','SST ID',P.sst)}${f('supplier.email','E-invoice email',P.email,'email')}${f('supplier.addr','Address',P.addr)}${f('supplier.tel','Tel/Fax',P.tel)}${f('supplier.bankName','Bank',P.bankName)}${f('supplier.bankAcc','Account no.',P.bankAcc)}${f('supplier.bankHolder','Account name',P.bankHolder)}</div></div>
  <div class="card"><h2>Backup</h2><div class="row"><button class="btn ghost" id="btnExp">Download backup (JSON)</button><label class="btn ghost" style="cursor:pointer">Restore backup<input type="file" id="fileRestore" accept=".json" class="hide"></label><span class="sub" style="margin:0">${Object.keys(DATA).length} station-days stored.</span></div></div>`;
}
function wireSet(){
  document.querySelectorAll('[data-cfg]').forEach(i=>i.onchange=()=>{const path=i.dataset.cfg.split('.');let o=CFG;for(let k=0;k<path.length-1;k++)o=o[path[k]];const last=path[path.length-1];o[last]=i.type==='number'?+i.value:i.value});
  $('#btnSaveCfg').onclick=saveCfg;
  $('#btnExp').onclick=()=>{const blob=new Blob([JSON.stringify({data:DATA,cfg:CFG,und:UND},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`ferry-backup-${todayISO()}.json`;a.click()};
  $('#fileRestore').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(j.data){Object.assign(DATA,j.data);Object.keys(j.data).forEach(k=>DIRTY.add(k))}if(j.und){const have=new Set(UND.map(uKey));for(const u of j.und)if(!have.has(uKey(u))){UND.push(u);UDIRTY.add(uKey(u))}}if(j.cfg)CFG=deepMerge(JSON.parse(JSON.stringify(DEF_CFG)),j.cfg);persistLocal();if(UI.session)await cloudPush([...DIRTY]);toast('Backup restored');render()}catch(err){toast('Bad backup file')}};
}


function pageUnd(){
  const start=UI.undStart||'2026-10-06';
  const card=st=>{const L=undLedger(st),bal=L.length?L[L.length-1].bal:0;
    return `<div class="card"><div class="row" style="justify-content:space-between"><h2 class="${STATIONS[st].cls}" style="margin:0">UNDERSALES TRACKER — ${STATIONS[st].name}</h2><div style="text-align:right"><div class="sub" style="margin:0;font-size:12px">Outstanding balance (RM)</div><b style="font-size:22px;${bal>0.004?'color:var(--bad)':''}">${fmt(bal)}</b></div></div>
    <div class="tw" style="margin-top:10px;max-height:46vh"><table><thead><tr><th>Date</th><th>Description</th><th>Undersale (RM)</th><th>Recovered (RM)</th><th>Balance (RM)</th><th>Date cleared</th><th></th></tr></thead><tbody>
    ${L.map(r=>`<tr><td>${dmy(r.date)}</td><td style="text-align:left;white-space:normal">${esc(r.desc)}</td><td>${r.kind==='undersale'?fmt(r.amount):''}</td><td>${r.kind==='recovery'?fmt(r.amount):''}</td><td>${fmt(r.bal)}</td><td>${r.cleared?dmy(r.cleared):''}</td><td><button class="btn ghost sm" data-udel="${esc(r.key)}">✕</button></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--mute)">No entries yet</td></tr>'}</tbody></table></div>
    <div class="row" style="margin-top:10px;align-items:flex-end"><label class="f">Date<input type="date" id="ua_d_${st}" value="${todayISO()}"></label><label class="f">Type<select id="ua_k_${st}"><option value="undersale">Undersale</option><option value="recovery">Recovered</option></select></label><label class="f">Amount (RM)<input type="number" step="0.01" min="0" id="ua_a_${st}" style="width:110px"></label><label class="f" style="flex:1;min-width:160px">Description<input type="text" id="ua_t_${st}" placeholder="e.g. Agent under-charged: booking ..."></label><button class="btn" data-uadd="${st}">Add</button></div></div>`};
  return `<div class="top"><div><h1>Undersales</h1><p class="sub">When a settlement nets <b>negative</b> (agent commission &gt; online net), the shortfall is an undersale. Later positive settlements recover it. Same layout as your UNDERSALES Excel.</p></div>
   <div class="row"><label class="btn ghost" style="cursor:pointer">Import UNDERSALES Excel<input type="file" id="undFile" accept=".xlsx,.xls" class="hide"></label><button class="btn ghost" id="undExport">⬇ Export Excel</button></div></div>
  <div class="card"><h2>Suggest from daily data</h2><p class="sub" style="margin:0 0 8px">Tue/Wed/Thu settle on their own day; Fri+Sat+Sun+Mon settle together on Monday (this reproduces your Mersing Excel exactly). Days already in the tracker are skipped. Review before adding.</p>
   <div class="row" style="align-items:flex-end"><label class="f">Track from (first batch day)<input type="date" id="undStart" value="${start}"></label><button class="btn" id="undSug">Find undersales / recoveries</button></div><div id="undSugOut"></div></div>
  ${card('MERSING')}${card('TG_GEMOK')}`;
}
function wireUnd(){
  const q=x=>document.querySelector(x);
  q('#undStart').onchange=e=>UI.undStart=e.target.value;
  q('#undFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{await loadXLSX();const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const list=parseUndersalesWb(wb);
      if(!list.length)return toast('No tracker rows found (need sheets named MERSING / TANJUNG GEMOK with Date column).',7000);
      const r=await undAdd(list,'excel');toast(`Imported ${r.added} row(s)${r.dup?`, ${r.dup} already existed`:''}${r.cloud===true?' · saved to cloud':r.cloud===false?' · cloud save FAILED':' · this device only (login to save to cloud)'}`,7000);render()}
    catch(err){console.error(err);toast('Could not read file: '+err.message,6000)}};
  q('#undSug').onclick=()=>{
    const start=q('#undStart').value||'2026-10-06';UI.undStart=start;
    const sug=SK.flatMap(s=>undSuggest(s,start));UI.undSugList=sug;
    const out=q('#undSugOut');
    if(!sug.length){out.innerHTML='<p class="sub" style="margin-top:10px">Nothing new to add from '+dmy(start)+' — tracker already matches the daily data.</p>';return}
    out.innerHTML=`<div class="tw" style="margin-top:10px;max-height:40vh"><table><thead><tr><th></th><th>Station</th><th>Date</th><th>Type</th><th>Amount</th><th>Description</th></tr></thead><tbody>${sug.map((u,i)=>`<tr><td><input type="checkbox" data-sg="${i}" checked></td><td>${STATIONS[u.station].name}</td><td>${dmy(u.date)}</td><td>${u.kind==='undersale'?'Undersale':'Recovered'}</td><td>${fmt(u.amount)}</td><td style="text-align:left">${esc(u.desc)}</td></tr>`).join('')}</tbody></table></div><div class="row" style="margin-top:8px"><button class="btn" id="undSugAdd">Add selected to tracker</button></div>`;
    q('#undSugAdd').onclick=async()=>{const pick=[...document.querySelectorAll('[data-sg]')].filter(c=>c.checked).map(c=>UI.undSugList[+c.dataset.sg]);
      const r=await undAdd(pick,'suggest');toast(`Added ${r.added} row(s)${r.cloud===true?' · saved to cloud':r.cloud===false?' · cloud save FAILED':' · this device only'}`,5000);render()};
  };
  document.querySelectorAll('[data-uadd]').forEach(b=>b.onclick=async()=>{const st=b.dataset.uadd;
    const date=q('#ua_d_'+st).value,kind=q('#ua_k_'+st).value,amount=+q('#ua_a_'+st).value,desc=q('#ua_t_'+st).value.trim();
    if(!date||!(amount>0))return toast('Enter a date and an amount above 0');
    const r=await undAdd([{station:st,date,kind,amount,desc:desc||(kind==='recovery'?'Recovered from settlement':'Undersale')}],'manual');
    toast(r.dup?'That exact entry already exists':(r.cloud===false?'Saved locally — cloud save failed':'Added'+(r.cloud?'':'')),3500);render()});
  document.querySelectorAll('[data-udel]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this tracker row?'))return;await undDelete(b.dataset.udel);render()});
  q('#undExport').onclick=async()=>{
    try{await loadXLSX()}catch(e){return toast(e.message,5000)}
    const wb=XLSX.utils.book_new();
    for(const st of SK){const L=undLedger(st);const bal=L.length?L[L.length-1].bal:0;
      const aoa=[['UNDERSALES TRACKER - '+STATIONS[st].name],['Outstanding balance (RM):','',bal],[],['Date','Description','Undersale (RM)','Recovered (RM)','Balance (RM)','Date Cleared'],
        ...L.map(r=>[dmy(r.date),r.desc,r.kind==='undersale'?r.amount:'',r.kind==='recovery'?r.amount:'',r.bal,r.cleared?dmy(r.cleared):''])];
      const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:12},{wch:46},{wch:15},{wch:15},{wch:14},{wch:14}];XLSX.utils.book_append_sheet(wb,ws,STATIONS[st].name)}
    XLSX.writeFile(wb,`UNDERSALES MERSING TG ${todayISO()}.xlsx`)};
}

/* ---------- shell ---------- */
function go(p){UI.page=p;render()}
function render(){
  ensureMonth();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===UI.page));
  const m=$('#main');
  m.innerHTML={dash:pageDash,data:pageData,up:pageUp,und:pageUnd,inv:pageInv,set:pageSet}[UI.page]();
  wireMonth();
  m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  ({dash:wireDash,data:wireData,up:wireUp,und:wireUnd,inv:wireInv,set:wireSet}[UI.page]||(()=>{}))();
  setSync();
}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.p)};
$('#btnAuth').onclick=openAuth;
render();initSb();
</script>
